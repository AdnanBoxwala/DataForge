[project]
name = "dataforge"
version = "0.1.0"
description = "A CLI tool that ingests vehicle measurement data, validates it against configurable rules, and produces a pass/fail report."
readme = "README.md"
authors = [
    { name = "AdnanBoxwala", email = "143093290+AdnanBoxwala@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asammdf>=8.8.25",
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
dataforge = "dataforge.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
# Pinned so lint and format results are identical locally, in pre-commit, and
# in CI.
target-version = "py313"

[tool.mypy]
python_version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: drives the installed console script in a subprocess (slower)",
    "regression: asserts pipeline output against a committed baseline",
]

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "k9s>=1.0.56",
    "mypy>=2.3.1",
    "myst-parser>=5.1.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.5",
    "types-pyyaml>=6.0.12.20260815",
]
